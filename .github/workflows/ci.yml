name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python Unit Tests & Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot edge-tts psutil python-dotenv aiohttp requests

      - name: Python Syntax & Static Analysis
        run: |
          python -m py_compile bot.py formatters.py reactions.py doctor.py

      - name: Run Basic Diagnostics
        run: |
          python -c "import bot, formatters, reactions; print('Core modules imported successfully!')"
